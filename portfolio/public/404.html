<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yogesh Kondurkar</title>
    <script>
      // Redirect to index with the path encoded in the query string
      var path = window.location.pathname;
      window.location.replace(
        window.location.origin + '/?p=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
