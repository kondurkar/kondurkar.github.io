<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(0,200,255,0.05)" stroke-width="1">
    <line x1="0" y1="60"  x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="60"  y1="0" x2="60"  y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="80" y="80" width="120" height="3" fill="url(#accent)" rx="2"/>

  <!-- Role tag -->
  <text x="80" y="140" font-family="monospace" font-size="18" fill="#00c8ff" letter-spacing="3">
    SENIOR FRONTEND DEVELOPER
  </text>

  <!-- Name -->
  <text x="80" y="260" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" fill="#e4eaf2" letter-spacing="-2">
    Yogesh
  </text>
  <text x="80" y="360" font-family="Arial Black, sans-serif" font-size="88" font-weight="900" fill="none"
        stroke="#00c8ff" stroke-width="1.5" letter-spacing="-2">
    Kondurkar
  </text>

  <!-- Subline -->
  <text x="80" y="430" font-family="monospace" font-size="20" fill="#7a8fa8">
    10+ years · React · Angular · TypeScript · Material UI · Mumbai
  </text>

  <!-- Skills pills -->
  <rect x="80"  y="470" width="80"  height="30" rx="4" fill="rgba(0,200,255,0.1)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
  <text x="120" y="490" font-family="monospace" font-size="13" fill="#00c8ff" text-anchor="middle">React</text>

  <rect x="174" y="470" width="100" height="30" rx="4" fill="rgba(0,200,255,0.1)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
  <text x="224" y="490" font-family="monospace" font-size="13" fill="#00c8ff" text-anchor="middle">TypeScript</text>

  <rect x="288" y="470" width="88"  height="30" rx="4" fill="rgba(0,200,255,0.1)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
  <text x="332" y="490" font-family="monospace" font-size="13" fill="#00c8ff" text-anchor="middle">Angular</text>

  <rect x="390" y="470" width="110" height="30" rx="4" fill="rgba(0,200,255,0.1)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
  <text x="445" y="490" font-family="monospace" font-size="13" fill="#00c8ff" text-anchor="middle">Material UI</text>

  <rect x="514" y="470" width="70"  height="30" rx="4" fill="rgba(0,200,255,0.1)" stroke="rgba(0,200,255,0.3)" stroke-width="1"/>
  <text x="549" y="490" font-family="monospace" font-size="13" fill="#00c8ff" text-anchor="middle">Redux</text>

  <!-- URL bottom right -->
  <text x="1120" y="570" font-family="monospace" font-size="16" fill="#7a8fa8" text-anchor="end">
    kondurkar.github.io
  </text>

  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
